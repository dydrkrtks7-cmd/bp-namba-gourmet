<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="305" cy="353" r="23" fill="#880e4f" opacity="0.15"/>
    <circle cx="1219" cy="100" r="43" fill="#880e4f" opacity="0.16"/>
    <circle cx="541" cy="163" r="92" fill="#880e4f" opacity="0.09"/>
    <circle cx="109" cy="194" r="23" fill="#880e4f" opacity="0.12"/>
    <circle cx="65" cy="555" r="47" fill="#880e4f" opacity="0.18"/>
    <circle cx="53" cy="381" r="31" fill="#880e4f" opacity="0.10"/>
    <rect x="-43" y="-65" width="77" height="21" rx="8" fill="#b71c1c" opacity="0.11" transform="rotate(13, 104, -8)"/>
    <rect x="923" y="-34" width="64" height="22" rx="8" fill="#b71c1c" opacity="0.13" transform="rotate(23, 842, 610)"/>
    <rect x="1285" y="499" width="55" height="48" rx="8" fill="#b71c1c" opacity="0.08" transform="rotate(15, 729, 328)"/>
    <rect x="1101" y="27" width="76" height="80" rx="8" fill="#b71c1c" opacity="0.04" transform="rotate(32, 655, -51)"/>
    <rect x="254" y="140" width="62" height="83" rx="8" fill="#b71c1c" opacity="0.04" transform="rotate(28, 288, 58)"/>
    <rect x="182" y="461" width="94" height="44" rx="8" fill="#b71c1c" opacity="0.12" transform="rotate(13, 1162, 506)"/>
    <rect x="928" y="42" width="92" height="97" rx="8" fill="#b71c1c" opacity="0.04" transform="rotate(31, 1287, 677)"/>
    <rect x="785" y="541" width="41" height="28" rx="8" fill="#b71c1c" opacity="0.05" transform="rotate(41, 578, -85)"/>
    <polygon points="1142,506 1167,556 1117,556" fill="#880e4f" opacity="0.06"/>
    <polygon points="684,195 714,255 654,255" fill="#880e4f" opacity="0.12"/>
    <polygon points="344,351 432,527 256,527" fill="#880e4f" opacity="0.09"/>
    <polygon points="827,-16 874,78 780,78" fill="#880e4f" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,556 C360,593 840,519 1200,556 L1200,630 L0,630Z" fill="#880e4f" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Namba gourmet 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Namba — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffd600" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffd600" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Namba Namba gourmet 안내 — 정보
  </text>
</svg>